apis:
- name: LevelBlue Open Threat Exchange (OTX) DirectConnect API
  description: >-
    The OTX DirectConnect API provides programmatic access to the LevelBlue Open Threat Exchange, an open
    community threat-intelligence platform. It exposes indicators (IPs, domains, hostnames, file hashes,
    URLs, CVEs, NIDS), pulses (curated collections of related indicators with tags, TLP levels and targeted
    countries), keyword search over users and pulses, and user subscription management. Access is by API
    key, validated against the users/me endpoint.
  humanURL: https://otx.alienvault.com/assets/static/external_api.html
  baseURL: https://otx.alienvault.com/api/v1
  tags:
  - Threat Intelligence
  - Indicators of Compromise
  - Security
  properties:
