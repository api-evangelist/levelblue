aid: levelblue
name: LevelBlue
description: 'LevelBlue is a pure-play managed security service provider (MSSP), formed from
  AT&T Cybersecurity and the AlienVault platform it acquired, delivering managed detection and
  response, managed cloud and network security, incident readiness and response, cyber advisory,
  exposure management and email security, backed by SpiderLabs threat intelligence. Its
  developer surface is the USM Anywhere v2.0 REST API — a per-tenant, OAuth 2.0
  client-credentials API over alarms and normalized security events, with HAL pagination and a
  webhook connector for pushing third-party events into the platform — alongside the LevelBlue
  Open Threat Exchange (OTX) DirectConnect API for community threat intelligence.'
